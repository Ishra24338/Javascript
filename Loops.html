<!DOCTYPE html>
<html lang="en">
<head>
  
</head>
<body>
    <h2>Javascript Fruit Loops</h2>
  <p id="demo"></p>
</body>


<script>
var fruits = ["Apples", "Mango", "Grapes", "Watermelon", "Jackfruit"];

var text="";
var i;


for( i=0; i<5; i++){

    text = text + fruits[i]+"<br>"
}
document.getElementById("demo").innerHTML = text


</script>


</html>
