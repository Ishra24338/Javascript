<!DOCTYPE html>
<html lang="en">

<head>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <style>
      body {
         background-color: rgb(253, 253, 187)
      }

      h1 {
         color: rgb(210, 105, 30);
      }

      .card-label {
         font-size: 11px;
         color: 999;
         text-transform: uppercase;
      }

      pre {
         font-size: 13px;
         color:#333;
      }
   </style>
</head>

<body class="py-4">
   <div class="container">
      <h1 class="mb-1"> My phone contact </h1>
      <p class="text muted-mb"> Introduction to objects in Javascript</p>

      <div class="card shadow-sm  mb-3" style="max-width:400px">
         <div calss="card body">
            <h5 class="card-title" style="color:rgb(210, 105, 30);"> Contact Details</h5>
            <ul class="list-group list-group-flush">
               <li class="list group item">
                  <span class="card-label d-block">Name<span>
                        <strong id="name">-</strong>
               </li>
               <li class="list group item">
                  <span class="card-label d-block">Phone<span>
                        <strong id="phone">-</strong>
               </li>

               <li class="list group item">
                  <span class="card-label d-block">School<span>
                        <strong id="school">-</strong>
               </li>
               <li class="list group item">
                  <span class="card-label d-block">City<span>
                        <strong id="city">-</strong>
               </li>


            </ul>

         </div>
      </div>


      <div class="card shadow-sm" style="max-width:400px" ;>
         <div class="card-body">
            <h6 style="color:rgb(210, 105, 30)">Javascript objects used</h6>
            <pre id="codeDisplay" class="bg-light p-3 rounded border mb-0"></pre>
         </div>
      </div>


   </div>
</body>
<script>
   // step-1  create the contact object
   var myContact={
      name:"Riya Sharma",
      phone:"98765-43219",
      school:"Sunrise Academy",
      city:"Mumbai"
   };
// step-2 dot notation
var nameelement=document.getElementById("name");
var phoneelement=document.getElementById("phone");
var schoolelement=document.getElementById("school");
var cityelement=document.getElementById("city");

nameelement.textContent = myContact.name;
phoneelement.textContent = myContact.phone;
schoolelement.textContent = myContact.school;
cityelement.textContent = myContact.city;
//step-3  shpw the object in code box

var codeelement=document.getElementById("codeDisplay");

codeelement.textContent=

' var myContact = {\n' +

' name: "' + myContact.name + '",\n' +

' phone: "' + myContact.phone + '",\n' +

' school: "' + myContact["school"] + '",\n' +

' city: "' + myContact["city"] + '"\n' +

'};'


</script>
</html>
