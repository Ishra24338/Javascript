<html>

<head>
    <title>My zoo</title>
</head>

<body>
    <h1>My zoo</h1>
    <p>Use Javascript and DOM to add animals to each cage</p>

    <div id="zoo">

        <div class="zone">

            Zone1: <span id="zone1"><span>

        </div>

        <div class="zone">

            Zone2: <span id="zone2"><span>

        </div>
        <div class="zone">

            Zone3: <span id="zone3"><span>

        </div>
        <div class="zone">

            Total Animals : <span id="total"><span>

        </div>
    </div>
    <br>
    <button onclick="openZoo()"> Open the Zoo! </button>
            <p id="zoo status"></p>
</body>
<script src="my zoo.js"></script>
    </html>
